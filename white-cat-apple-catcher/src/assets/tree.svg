<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="Рисунок дерева">
  <defs>
    <linearGradient id="trunkGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8B5A2B"/>
      <stop offset="1" stop-color="#603813"/>
    </linearGradient>
    <radialGradient id="leafGrad" cx="50%" cy="30%" r="60%">
      <stop offset="0" stop-color="#9be56b"/>
      <stop offset="0.6" stop-color="#58a63b"/>
      <stop offset="1" stop-color="#2f7a25"/>
    </radialGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Небо -->
  <rect width="100%" height="100%" fill="#e6f7ff"/>

  <!-- Трава -->
  <ellipse cx="400" cy="760" rx="520" ry="120" fill="#bfe6a6"/>

  <!-- Тень от кроны -->
  <ellipse cx="400" cy="650" rx="150" ry="30" fill="#000" opacity="0.08"/>

  <!-- Ствол -->
  <g transform="translate(360,300)">
    <path d="M80 500 C70 420 70 320 90 280 C60 240 60 180 100 140 C140 100 140 60 140 60
             C120 80 100 90 90 110 C80 130 80 210 120 260 C150 300 140 380 160 460 C170 500 170 520 120 520
             L80 520 Z"
          fill="url(#trunkGrad)" filter="url(#softShadow)"/>
    <!-- Ветви -->
    <path d="M120 200 C180 170 240 140 320 120" stroke="#6b3f21" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M90 220 C30 180 -20 140 -40 100" stroke="#6b3f21" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M140 260 C220 240 300 230 360 220" stroke="#6b3f21" stroke-width="10" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Крона (множество кругов с градиентом) -->
  <g transform="translate(0,0)" fill="url(#leafGrad)" filter="url(#softShadow)">
    <circle cx="400" cy="220" r="120" />
    <circle cx="320" cy="260" r="90" />
    <circle cx="480" cy="260" r="100" />
    <circle cx="360" cy="170" r="80" />
    <circle cx="440" cy="170" r="70" />
    <circle cx="260" cy="210" r="60" />
    <circle cx="540" cy="210" r="55" />
    <circle cx="460" cy="320" r="60" />
    <circle cx="330" cy="320" r="55" />
    <!-- Акценты (листья) -->
    <ellipse cx="420" cy="230" rx="18" ry="9" transform="rotate(-25 420 230)" fill="#b7f07b"/>
    <ellipse cx="360" cy="240" rx="12" ry="6" transform="rotate(10 360 240)" fill="#8fe068"/>
    <ellipse cx="440" cy="200" rx="14" ry="7" transform="rotate(-40 440 200)" fill="#a6ee7f"/>
  </g>

  <!-- Птичка как маленький акцент -->
  <g transform="translate(470,160)">
    <path d="M0 0 C10 -6 20 -6 30 0 C20 -2 10 -2 0 0 Z" fill="#ff6b6b"/>
  </g>

  <!-- Подпись (необязательно) -->
  <text x="20" y="780" font-family="Verdana" font-size="14" fill="#3b3b3b">Нарисовано SVG — дерево</text>
</svg>
